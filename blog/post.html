<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug');

  if (!slug) {
    document.getElementById('postContent').innerHTML =
      '<p>Postingan tidak ditemukan. <a href="../blog/">Kembali ke Blog</a></p>';
    return;
  }

  fetch('/content/blog.json')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var post = null;

      for (var i = 0; i < data.posts.length; i++) {
        if (data.posts[i].slug && data.posts[i].slug === slug) { post = data.posts[i]; break; }
      }
      if (!post) {
        for (var j = 0; j < data.posts.length; j++) {
          if (data.posts[j].title === slug) { post = data.posts[j]; break; }
        }
      }

      if (!post) {
        document.getElementById('postContent').innerHTML =
          '<p>Postingan tidak ditemukan. <a href="../blog/">Kembali ke Blog</a></p>';
        return;
      }

      /* Postingan lama dengan file HTML terpisah → redirect */
      if (post.link) {
        window.location.href = post.link;
        return;
      }

      /* Judul & meta description dinamis */
      document.title = post.title + ' | JAYA WENTER';
      if (post.summary) document.getElementById('metaDesc').setAttribute('content', post.summary);

      var html = '<h1>' + post.title + '</h1>';

      /* Hero image */
      if (post.cover) {
        var src = post.cover;
        if (src.indexOf('http') !== 0 && src.indexOf('/') !== 0 && src.indexOf('../') !== 0) src = '../' + src;
        html += '<img src="' + src + '" alt="' + post.title + '" class="blog-thumb-hero">';
      }

      /* Isi artikel */
      if (post.body) {
        html += marked.parse(post.body);
      }

      /* Tags (tetap ditampilkan) */
      if (Array.isArray(post.keywords) && post.keywords.length > 0) {
        html += '<div class="post-keywords"><b>Tags:</b><br>';
        post.keywords.forEach(function(kw) {
          html += '<span>' + kw + '</span>';
        });
        html += '</div>';
      }

      document.getElementById('postContent').innerHTML = html;
    })
    .catch(function(err) {
      document.getElementById('postContent').innerHTML =
        '<p style="color:#c00;">Gagal memuat artikel.</p>';
    });
})();
</script>
