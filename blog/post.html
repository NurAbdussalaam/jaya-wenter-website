.post-meta{ color:#666; font-size:14px; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #eee; }

.post-body img{ max-width:100%; height:auto; border-radius:8px; margin:16px 0; }
.post-body ul, .post-body ol{ margin-bottom:16px; padding-left:24px; }
.post-keywords{ margin-top:30px; padding-top:20px; border-top:1px solid #eee; font-size:13px; color:#666; }
.post-keywords span{ display:inline-block; background:#f0f0f0; padding:4px 10px; border-radius:12px; margin:4px 4px 0 0; }

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug');
  
  if (!slug) {
    document.getElementById('postContainer').innerHTML = 
      '<a href="/blog/" class="back-link">← Kembali ke Blog</a><p>Postingan tidak ditemukan.</p>';
    return;
  }
  
  fetch('/content/blog.json')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var post = null;
      
      // Cari berdasarkan slug (untuk postingan baru)
      for (var i = 0; i < data.posts.length; i++) {
        if (data.posts[i].slug && data.posts[i].slug === slug) {
          post = data.posts[i];
          break;
        }
      }
      
      // Fallback: cari berdasarkan title (untuk kompatibilitas lama)
      if (!post) {
        for (var j = 0; j < data.posts.length; j++) {
          if (data.posts[j].title === slug) {
            post = data.posts[j];
            break;
          }
        }
      }
      
      if (!post) {
        document.getElementById('postContainer').innerHTML = 
          '<a href="/blog/" class="back-link">← Kembali ke Blog</a><p>Postingan tidak ditemukan.</p>';
        return;
      }
      
      // Postingan lama dengan file HTML terpisah → redirect
      if (post.link) {
        window.location.href = post.link;
        return;
      }
      
      // Render postingan dari JSON
      document.title = post.title + ' | JAYA WENTER';
      
      var html = '<a href="/blog/" class="back-link">← Kembali ke Blog</a>';
      html += '<h1 class="post-title">' + post.title + '</h1>';
      html += '<div class="post-meta">' + (post.date || '') + (post.category ? ' | ' + post.category : '') + '</div>';
      
      if (post.cover) {
        html += '<img src="' + post.cover + '" alt="' + post.title + '" class="post-cover">';
      }
      
      if (post.body) {
        html += '<div class="post-body">' + marked.parse(post.body) + '</div>';
      }
      
      // Tampilkan keywords sebagai tag di bawah
      if (Array.isArray(post.keywords) && post.keywords.length > 0) {
        html += '<div class="post-keywords"><b>Tags:</b><br>';
        post.keywords.forEach(function(kw) {
          html += '<span>' + kw + '</span>';
        });
        html += '</div>';
      }
      
      document.getElementById('postContainer').innerHTML = html;
    })
    .catch(function(err) {
      document.getElementById('postContainer').innerHTML = 
        '<a href="/blog/" class="back-link">← Kembali ke Blog</a><p style="color:#c00;">Gagal memuat artikel.</p>';
    });
})();
</script>
