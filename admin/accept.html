<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Aktivasi Akun Admin</title>
<style>
  body{font-family:sans-serif;max-width:560px;margin:50px auto;padding:0 16px;}
  input{width:100%;padding:10px;margin:6px 0 16px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;}
  button{padding:10px 22px;border:none;border-radius:6px;background:#001d5a;color:#fff;font-weight:700;cursor:pointer;}
  #out{margin-top:20px;white-space:pre-wrap;font-size:13px;background:#f4f4f4;padding:10px;border-radius:6px;}
</style>
</head>
<body>
<h2>Aktivasi Akun Admin</h2>

<p><b>Email:</b></p>
<input id="email" value="nur.abdussalaam@gmail.com">

<p><b>Password baru:</b></p>
<input id="pass" type="password" placeholder="Minimal 6 karakter">

<p><b>Secret:</b></p>
<input id="secret" placeholder="Isi dengan nilai BOOTSTRAP_SECRET">

<button onclick="go()">Aktifkan Akun</button>

<pre id="out"></pre>

<script>
function log(s){ document.getElementById('out').textContent += s + '\n'; }

async function go(){
  var email  = document.getElementById('email').value.trim();
  var pass   = document.getElementById('pass').value;
  var secret = document.getElementById('secret').value;
  var out    = document.getElementById('out');
  out.textContent = '';
  log('Mengirim permintaan...');

  var r = await fetch('/.netlify/functions/setpass', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, password: pass, secret: secret})
  });
  var t = await r.text();
  log('Status ' + r.status + ' : ' + t.slice(0, 300));

  if (r.ok) {
    log('BERHASIL! Buka /admin/ dan login dengan email + password baru.');
  } else {
    log('GAGAL. Kirim screenshot log ini.');
  }
}
</script>
</body>
</html>
